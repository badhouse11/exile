# EXILE room server (Cloudflare Workers). The website itself lives on Netlify.
name = "exile-rooms"
main = "server/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The website itself, served from the same address as the rooms.
[assets]
directory = "./dist"
binding = "ASSETS"
